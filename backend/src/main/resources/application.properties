spring.application.name=backend

# H2 in-memory DB
spring.datasource.url=jdbc:h2:mem:stylebyweather
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console (http://localhost:8080/h2-console)
# Spring Boot 4에서는 H2 console 자동설정이 빠져 H2ConsoleConfig 빈으로 직접 등록

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# OpenWeatherMap (API 키는 환경변수 OPENWEATHERMAP_API_KEY로 주입)
openweathermap.api-key=${OPENWEATHERMAP_API_KEY:}
openweathermap.base-url=https://api.openweathermap.org/data/2.5
